<!doctype html>
<meta charset="utf-8">
<title>Request trace</title>
<style>
  :root { --bg:#1e1e1e; --panel:#252526; --ink:#e6e9ee; --muted:#8b949e; --accent:#d97757; --ok:#8fa98f; --err:#e39b9b; --line:#3a3f47; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, "Segoe UI", sans-serif; height:100%; }
  .wrap { padding:12px 14px; display:flex; flex-direction:column; gap:0; height:100%; box-sizing:border-box; }
  h1 { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .node { background:var(--panel); border:2px solid var(--line); border-radius:10px; padding:6px 12px; display:flex; align-items:center; gap:10px; transition:border-color .25s, box-shadow .25s; }
  .node.on { border-color:var(--accent); box-shadow:0 0 0 3px rgba(217,119,87,.18); }
  .node .ic { width:30px; height:30px; border-radius:50%; background:#2d3139; display:grid; place-items:center; font-size:15px; }
  .node b { display:block; font-size:14px; } .node small { color:var(--muted); font-size:12px; }
  .link { position:relative; height:34px; margin-left:28px; border-left:2px solid var(--line); }
  .dot { position:absolute; left:-7px; width:12px; height:12px; border-radius:50%; background:var(--accent); opacity:0; top:0; }
  .dot.back { background:#e6e9ee; }
  .dot.go { animation:down 1.1s ease-in-out forwards; } .dot.ret { animation:up 1.1s ease-in-out forwards; }
  @keyframes down { from{top:-6px;opacity:1} to{top:26px;opacity:1} } @keyframes up { from{top:26px;opacity:1} to{top:-6px;opacity:1} }
  .lab { position:absolute; left:14px; top:8px; font:12px/1 ui-monospace, Menlo, monospace; color:var(--ink); background:#2d3139; padding:4px 8px; border-radius:6px; opacity:0; transition:opacity .2s; white-space:nowrap; }
  .lab.show { opacity:1; }
  .log { margin-top:8px; font:11.5px/1.45 ui-monospace, Menlo, monospace; color:var(--muted); border-top:1px solid var(--line); padding-top:6px; overflow:hidden; white-space:nowrap; }
  .log .ok { color:var(--ok); } .log .err { color:var(--err); }
</style>
<div class="wrap">
  <h1>Where the request goes</h1>
  <div class="node" id="n-script"><div class="ic">🐍</div><div><b>Our script</b><small id="script-name">builds the request</small></div></div>
  <div class="link" id="l2"><div class="dot" id="d2"></div><div class="lab" id="t2"></div></div>
  <div class="node" id="n-api"><div class="ic">☁</div><div><b>Claude API</b><small>runs the model</small></div></div>
  <div class="log" id="log"></div>
</div>
<script>
  const q = (s) => document.querySelector(s);
  let seen = 0;
  const on = (id) => { document.querySelectorAll('.node').forEach(n => n.classList.remove('on')); if (id) q(id).classList.add('on'); };
  const travel = (link, label, back) => { const d = q('#d' + link), t = q('#t' + link); d.className = 'dot' + (back ? ' back' : ''); void d.offsetWidth; d.classList.add(back ? 'ret' : 'go'); t.textContent = label; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); };
  const log = (txt, cls) => { const l = q('#log'); const e = document.createElement('div'); e.textContent = txt; if (cls) e.className = cls; l.appendChild(e); while (l.children.length > 6) l.removeChild(l.firstChild); };
  async function poll() {
    try {
      const r = await fetch('trace.jsonl?' + Date.now(), { cache: 'no-store' }); const lines = (await r.text()).trim().split('\n').filter(Boolean); if (lines.length < seen) { seen = 0; on(null); q('#log').innerHTML = ''; }
      for (const line of lines.slice(seen)) {
        const ev = JSON.parse(line);
        if (ev.event === 'start') { const n = (ev.argv && ev.argv.endsWith('.py')) ? ev.argv : 'our script'; document.getElementById('script-name').textContent = n + ' builds the request'; on('#n-script'); log('$ python ' + n); }
        if (ev.event === 'request') { const m = ev.body && ev.body.model ? ev.body.model : ''; travel(2, ev.method + ' /v1/messages', false); setTimeout(() => on('#n-api'), 1100); log('→ ' + ev.method + ' ' + new URL(ev.url).pathname + (m ? '  model=' + m : '') + (ev.body && ev.body.max_tokens ? '  max_tokens=' + ev.body.max_tokens : '')); }
        if (ev.event === 'response') { const b = ev.body || {}; const ok = ev.status < 400; const counted = ok && b.stop_reason === undefined && b.input_tokens !== undefined; const lbl = ok ? (counted ? (ev.status + '  input_tokens: ' + b.input_tokens) : (ev.status + '  stop_reason: ' + b.stop_reason)) : (ev.status + ' ' + (b.error && b.error.type || 'error')); setTimeout(() => { travel(2, lbl, true); setTimeout(() => on('#n-script'), 1100); }, 300); log('← ' + ev.status + (ok ? (b.streamed ? '  streamed: text events as they arrive' : counted ? '  counted: ' + b.input_tokens + ' input tokens' : '  stop_reason=' + b.stop_reason + '  tokens ' + (b.usage ? b.usage.input_tokens + '/' + b.usage.output_tokens : '')) : '  ' + ((b.error && b.error.message) || '').slice(0, 70)), ok ? 'ok' : 'err'); }
      }
      seen = lines.length;
    } catch (e) { /* file not yet there */ }
    setTimeout(poll, 250);
  }
  poll();
</script>
